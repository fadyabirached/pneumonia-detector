name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements.txt pulls in tensorflow-cpu and streamlit, which are
      # heavy and unnecessary here: tests/ mocks out the TensorFlow calls,
      # and app.py's Streamlit UI glue isn't exercised by this suite. This
      # keeps CI fast while still checking the pure logic in model_utils.py.
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy pillow

      # A pinned version can be flat-out unpublished (tensorflow-cpu==2.16.0
      # never existed, only discovered when Streamlit Cloud tried to install
      # it for real) and the lightweight suite above would never notice,
      # since it never installs requirements.txt itself. --dry-run resolves
      # every pin against the real package index without downloading or
      # installing anything, so this catches that class of bug in seconds
      # instead of on a deploy.
      - name: Check requirements.txt pins actually resolve
        run: pip install --dry-run -r requirements.txt

      - name: Lint (app.py, model_utils.py, tests/)
        run: ruff check .

      - name: Compile check
        run: python -m py_compile app.py model_utils.py tests/test_model_utils.py

      - name: Run tests
        run: pytest -v
